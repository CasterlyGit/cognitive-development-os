[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-os"
version = "0.1.0"
description = "Local-first intent control-plane prototype"
requires-python = ">=3.9"

[project.scripts]
cognitive-os = "cognitive_os.cli:main"

[tool.setuptools.packages.find]
include = ["cognitive_os*"]
